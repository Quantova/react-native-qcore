[package]
name = "react-native-qcore"
version = "0.6.10"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "The React Native binding for the Quantova post quantum client core, generated over QCore with uniffi so the QMask wallet derives keys and signs on device with no wasm."
repository = "https://github.com/Quantova/react-native-qcore"

[lib]
name = "quantova_qcore"
crate-type = ["staticlib", "cdylib", "lib"]

[features]
cli = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[dependencies]
qcore = { git = "https://github.com/Quantova/QCore.rs.git", rev = "409b9556481efb6f7af2455a1f63669465db4982", default-features = false }
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", rev = "8dc50cf6eaa8bd521c0d203df5cb7fbf5b51e905" }
uniffi = { version = "0.29" }
zeroize = "1"
thiserror = "2"

[profile.release]
overflow-checks = true
