name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
env:
  NDK_VERSION: "27.2.12479018"
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: react-native-qcore
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy
      - name: test
        working-directory: react-native-qcore
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --all-features --locked

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: react-native-qcore
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.98.0"
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - name: cargo ndk
        run: cargo install --locked cargo-ndk --version 4.1.2
      - name: build
        working-directory: react-native-qcore
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          bash scripts/build-android.sh
      - name: checksums
        working-directory: react-native-qcore
        run: |
          find android/src/main/jniLibs android/src/main/java/uniffi -type f | LC_ALL=C sort | xargs sha256sum > SHA256SUMS.android
          cat SHA256SUMS.android
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-checksums: react-native-qcore/SHA256SUMS.android
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android
          if-no-files-found: error
          retention-days: 7
          path: |
            react-native-qcore/android/src/main/jniLibs
            react-native-qcore/android/src/main/java/uniffi
            react-native-qcore/SHA256SUMS.android

  ios:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: react-native-qcore
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.98.0"
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - name: build
        working-directory: react-native-qcore
        run: bash scripts/build-ios.sh
      - name: checksums
        working-directory: react-native-qcore
        run: |
          find ios/QuantovaQcore.xcframework ios/generated -type f ! -name .DS_Store | LC_ALL=C sort | xargs shasum -a 256 > SHA256SUMS.ios
          cat SHA256SUMS.ios
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-checksums: react-native-qcore/SHA256SUMS.ios
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ios
          if-no-files-found: error
          retention-days: 7
          path: |
            react-native-qcore/ios/QuantovaQcore.xcframework
            react-native-qcore/ios/generated
            react-native-qcore/SHA256SUMS.ios

  package:
    needs: [test, android, ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: react-native-qcore
          persist-credentials: false
      - name: no binaries from the repository
        working-directory: react-native-qcore
        run: rm -rf android/src/main/jniLibs android/src/main/java/uniffi ios/QuantovaQcore.xcframework ios/generated SHA256SUMS
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: android
          path: react-native-qcore
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ios
          path: react-native-qcore
      - name: checksums
        working-directory: react-native-qcore
        run: |
          cat SHA256SUMS.android SHA256SUMS.ios | LC_ALL=C sort -k 2 > SHA256SUMS
          rm SHA256SUMS.android SHA256SUMS.ios
          cat SHA256SUMS
          bash scripts/verify-binaries.sh
      - name: attestations
        working-directory: react-native-qcore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          if [[ "$GITHUB_REF" != "refs/tags/$tag" ]]; then
            echo "binaries are packaged only from the tag $tag, this run is for $GITHUB_REF" >&2
            exit 1
          fi
          digest="$(git rev-parse --verify "refs/tags/$tag^{commit}")"
          if [[ "$digest" != "$GITHUB_SHA" ]]; then
            echo "the tag $tag points at $digest, this run built $GITHUB_SHA" >&2
            exit 1
          fi
          awk '{ print $2 }' SHA256SUMS | while read -r built; do
            gh attestation verify "$built" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "refs/tags/$tag" \
              --source-digest "$digest" \
              --deny-self-hosted-runners > /dev/null
            echo "attested $built"
          done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: react-native-qcore/SHA256SUMS
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: pack
        working-directory: react-native-qcore
        run: |
          mkdir -p "$RUNNER_TEMP/pkg"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/pkg"
          ls "$RUNNER_TEMP/pkg"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: ${{ runner.temp }}/pkg/*.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: package
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/pkg/*.tgz

  publish:
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: react-native-qcore
          fetch-depth: 0
          persist-credentials: false
      - name: tag on main and matching the version
        working-directory: react-native-qcore
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          version="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "the tag $GITHUB_REF_NAME does not match the package version $version" >&2
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: package
          path: pkg
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish pkg/*.tgz --provenance --access public --ignore-scripts
      - name: the published version must carry provenance for this tag and commit
        working-directory: react-native-qcore
        env:
          PKG: "@quantovainc/react-native-qcore"
          WORKFLOW_PATH: .github/workflows/release.yml
        run: |
          set -euo pipefail
          V=$(node -p "require('./package.json').version")
          url=""
          for _ in $(seq 1 30); do
            url=$(npm view "$PKG@$V" dist.attestations.url 2>/dev/null || true)
            [ -n "$url" ] && break
            sleep 10
          done
          [ -n "$url" ] || { echo "$PKG@$V shows no provenance attestation" >&2; exit 1; }
          integrity=$(npm view "$PKG@$V" dist.integrity)
          curl -sSf "$url" -o "$RUNNER_TEMP/attestations.json"
          node - "$RUNNER_TEMP/attestations.json" "$integrity" "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_REF" "$WORKFLOW_PATH" <<'JS'
          'use strict';
          const fs = require('fs');
          const [file, integrity, repo, sha, ref, path] = process.argv.slice(2);
          const doc = JSON.parse(fs.readFileSync(file, 'utf8'));
          const slsa = (doc.attestations || []).filter((a) => a.predicateType === 'https://slsa.dev/provenance/v1');
          if (slsa.length !== 1) throw new Error('expected one SLSA provenance attestation, found ' + slsa.length);
          const st = JSON.parse(Buffer.from(slsa[0].bundle.dsseEnvelope.payload, 'base64').toString('utf8'));
          const want = Buffer.from(integrity.replace(/^sha512-/, ''), 'base64').toString('hex');
          if (!st.subject || st.subject.length !== 1 || st.subject[0].digest.sha512 !== want) throw new Error('the attested subject is not the published tarball');
          const bd = st.predicate.buildDefinition;
          const wf = bd.externalParameters.workflow;
          if (wf.repository !== 'https://github.com/' + repo) throw new Error('built from ' + wf.repository + ', not ' + repo);
          if (wf.path !== path) throw new Error('built by ' + wf.path + ', not ' + path);
          if (wf.ref !== ref) throw new Error('built from ref ' + wf.ref + ', not ' + ref);
          const src = (bd.resolvedDependencies || []).find((d) => d.digest && d.digest.gitCommit);
          if (!src || src.digest.gitCommit !== sha) throw new Error('built from commit ' + (src && src.digest.gitCommit) + ', not ' + sha);
          console.log('provenance binds ' + st.subject[0].name + ' to ' + repo + ' ' + ref + ' at ' + sha);
          JS
          check="$RUNNER_TEMP/signatures"
          mkdir -p "$check"
          cd "$check"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund --legacy-peer-deps "$PKG@$V" >/dev/null
          npm audit signatures
