name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: publish the built package to npm
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: react-native-qcore
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - name: cargo ndk
        run: cargo install --locked cargo-ndk --version 4.1.2
      - name: build
        working-directory: react-native-qcore
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          bash scripts/build-android.sh
      - name: checksums
        working-directory: react-native-qcore
        run: |
          find android/src/main/jniLibs android/src/main/java/uniffi -type f | LC_ALL=C sort | xargs sha256sum > SHA256SUMS.android
          cat SHA256SUMS.android
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-checksums: react-native-qcore/SHA256SUMS.android
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android
          if-no-files-found: error
          retention-days: 7
          path: |
            react-native-qcore/android/src/main/jniLibs
            react-native-qcore/android/src/main/java/uniffi
            react-native-qcore/SHA256SUMS.android

  ios:
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: react-native-qcore
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - name: build
        working-directory: react-native-qcore
        run: bash scripts/build-ios.sh
      - name: checksums
        working-directory: react-native-qcore
        run: |
          find ios/QuantovaQcore.xcframework ios/generated -type f ! -name .DS_Store | LC_ALL=C sort | xargs shasum -a 256 > SHA256SUMS.ios
          cat SHA256SUMS.ios
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-checksums: react-native-qcore/SHA256SUMS.ios
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ios
          if-no-files-found: error
          retention-days: 7
          path: |
            react-native-qcore/ios/QuantovaQcore.xcframework
            react-native-qcore/ios/generated
            react-native-qcore/SHA256SUMS.ios

  package:
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: react-native-qcore
          persist-credentials: false
      - name: no binaries from the repository
        working-directory: react-native-qcore
        run: rm -rf android/src/main/jniLibs android/src/main/java/uniffi ios/QuantovaQcore.xcframework ios/generated SHA256SUMS
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: android
          path: react-native-qcore
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ios
          path: react-native-qcore
      - name: checksums
        working-directory: react-native-qcore
        run: |
          cat SHA256SUMS.android SHA256SUMS.ios | LC_ALL=C sort -k 2 > SHA256SUMS
          rm SHA256SUMS.android SHA256SUMS.ios
          cat SHA256SUMS
          bash scripts/verify-binaries.sh
      - name: attestations
        working-directory: react-native-qcore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk '{ print $2 }' SHA256SUMS | while read -r built; do
            gh attestation verify "$built" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" > /dev/null
            echo "attested $built"
          done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: react-native-qcore/SHA256SUMS
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: version
        if: github.event_name == 'push'
        working-directory: react-native-qcore
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "the tag $GITHUB_REF_NAME does not match the package version $version" >&2
            exit 1
          fi
      - name: pack
        working-directory: react-native-qcore
        run: npm pack --dry-run
      - name: publish
        if: github.event_name == 'push' || inputs.publish
        working-directory: react-native-qcore
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
