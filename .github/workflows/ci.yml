name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: react-native-qcore
          persist-credentials: false
      - name: rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
          rustup default 1.98.0
      - name: fmt
        working-directory: react-native-qcore
        run: cargo fmt --all -- --check
      - name: clippy
        working-directory: react-native-qcore
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: test
        working-directory: react-native-qcore
        run: cargo test --all-features --locked
      - name: deny
        working-directory: react-native-qcore
        run: |
          cargo install --locked cargo-deny --version 0.19.9
          cargo deny check bans licenses sources advisories
  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: install gitleaks
        run: |
          set -euo pipefail
          ver=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz" -o "$RUNNER_TEMP/gl.tgz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gl.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gl.tgz" -C "$RUNNER_TEMP" gitleaks
          install -m 0755 "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
      - name: secret scan over full history
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/gitleaks.toml" <<'TOML'
          title = "quantova secret scan"
          [extend]
          useDefault = true
          [allowlist]
          description = "public, example, and checksum data that is not a secret"
          paths = [
            '''(^|/)Cargo\.lock$''',
            '''(^|/)package-lock\.json$''',
          ]
          regexes = [
            '''YOUR_[A-Z0-9_]+''',
            '''^[Qq]1[0-9A-Za-z]{25,}$''',
          ]
          TOML
          gitleaks detect --source . --no-banner --redact --config "$RUNNER_TEMP/gitleaks.toml"
