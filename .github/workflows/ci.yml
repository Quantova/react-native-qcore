name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: react-native-qcore
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Quantova/QCore.rs
          ref: acd36ba111b9eb6052489caa5c0396d87cef96a7
          path: QCore.rs
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Quantova/Quantova-Chain
          ref: 331348f53af78eb5187f00afce1c4fcf121057b3
          path: Quantova-Chain
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Quantova/QVM
          ref: faf4870915c3419fa5e350e3257bfffd1074fe1f
          path: QVM
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: fmt
        working-directory: react-native-qcore
        run: cargo fmt --all -- --check
      - name: clippy
        working-directory: react-native-qcore
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: test
        working-directory: react-native-qcore
        run: cargo test --all-features --locked
      - name: deny
        working-directory: react-native-qcore
        run: |
          cargo install --locked cargo-deny --version 0.19.9
          cargo deny check bans licenses sources advisories
